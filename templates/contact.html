{% extends 'layouts/base.html' %}

{% load i18n %}

{% load static %}

{% block content %}
            <div class="col-md-6 m-auto text-center">
            <h1 class="h1">{% trans 'Contact Us' %}</h1>
            <p>
                {% blocktranslate %}
                Proident, sunt in culpa qui officia deserunt mollit anim id est laborum.
                Lorem ipsum dolor sit amet.
                {% endblocktranslate %}
            </p>
        </div>
    </div>

    <!-- Start Map -->



    <!-- Start Contact -->
    <div class="container py-5">
        <div class="row py-5 d-flex justify-content-evenly">
            <div class="col-md-6"><iframe src="https://www.google.com/maps/embed?pb=!1m10!1m8!1m3!1d750.2988233397917!2d69.2245180687601!3d41.21751442881019!3m2!1i1024!2i768!4f13.1!5e0!3m2!1suz!2s!4v1789320218835!5m2!1suz!2s" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
    <!-- Ena Map --></div>
            <form class="col-md-6 m-auto" method="post">
                {% csrf_token %}
                <div class="row">
                    <div class="form-group col-md-6 mb-3">
                        <label for="name">{% trans 'Name' %}</label>
                        <input type="text" class="form-control mt-1" id="name" name="name" placeholder="{% trans 'Name' %}">
                    </div>
                    <div class="form-group col-md-6 mb-3">
                        <label for="email">{% trans 'Email' %}</label>
                        <input type="email" class="form-control mt-1" id="email" name="email" placeholder="{% trans 'Email' %}">
                    </div>
                </div>
                <div class="mb-3">
                    <label for="subject">{% trans 'Subject' %}</label>
                    <input type="text" class="form-control mt-1" id="subject" name="subject" placeholder="{% trans 'Subject' %}">
                </div>
                <div class="mb-3">
                    <label for="message">{% trans 'Message' %}</label>
                    <textarea class="form-control mt-1" id="message" name="message" placeholder="{% trans 'Message' %}" rows="8"></textarea>
                </div>
                <div class="row">
                    <div class="col text-end mt-2">
                        <button type="submit" class="btn btn-success btn-lg px-3">{% trans 'Let’s Talk' %}</button>
                    </div>
                </div>
            </form>
        </div>
    </div>
    <!-- End Contact -->



{% endblock %}
